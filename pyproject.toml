[project]
name = "podcast-animator"
version = "1.0.0"
description = "Verwandelt Podcast-Ausschnitte automatisch in animierte YouTube Shorts mit Untertiteln."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "faster-whisper>=1.1",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "skia-python>=87.6",
    "imageio-ffmpeg>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.40",
    "google-genai>=1.0",
]

[project.scripts]
podcast-animator = "podcast_animator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podcast_animator"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
